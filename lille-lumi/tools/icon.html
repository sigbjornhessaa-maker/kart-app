<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <title>Lumi-ikon</title>
  <style>body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
  <!-- Tegner app-ikonet med samme pikselgrafikk som spillet.
       Bruk: icon.html?size=512&grid=32  (grid = antall «store piksler» på tvers) -->
  <canvas id="c"></canvas>
  <script src="../js/sprites.js"></script>
  <script>
    const p = new URLSearchParams(location.search);
    const size = +p.get('size') || 512;
    const grid = +p.get('grid') || 32;

    // Tegn ikonet i lav oppløsning først.
    const small = Sprites.mkCanvas(grid, grid);
    const g = small.getContext('2d');
    const skyTop = '#2a1f5a', skyBottom = '#a35a9e';
    for (let y = 0; y < grid; y++) {
      const band = Math.floor((y / grid) * 8) / 7;
      g.fillStyle = Sprites.lerpColor(skyTop, skyBottom, band);
      g.fillRect(0, y, grid, 1);
    }
    const rng = Sprites.mulberry32(7);
    for (let i = 0; i < grid * 0.7; i++) {
      g.fillStyle = rng() < 0.3 ? '#ffffff' : '#c9b8ff';
      g.fillRect(Math.floor(rng() * grid), Math.floor(rng() * grid), 1, 1);
    }
    // Liten planet i hjørnet
    const planet = Sprites.makePlanet(4, { a: '#ffd07a', b: '#fff0c0', ring: '#8fe8ff' }, skyTop, 3);
    g.drawImage(planet, 1, 1);
    // Stjernestøv
    g.drawImage(Sprites.DUST_FRAMES[0], grid - 8, grid - 8);

    // Lumi i raketten, midt i ikonet
    const lumi = Sprites.lumiFrames('klassisk', 'ingen')[0];
    const lx = Math.round(grid / 2 - Sprites.PIVOT_X + 1);
    const ly = Math.round(grid / 2 - Sprites.PIVOT_Y + 3);
    g.fillStyle = '#ff9f43';
    g.fillRect(lx + Sprites.OX - 4, ly + Sprites.PIVOT_Y, 4, 1);
    g.fillStyle = '#ffd447';
    g.fillRect(lx + Sprites.OX - 2, ly + Sprites.PIVOT_Y - 1, 3, 3);
    g.fillStyle = '#fff3a8';
    g.fillRect(lx + Sprites.OX, ly + Sprites.PIVOT_Y, 1, 1);
    g.drawImage(lumi, lx, ly);

    // Skaler opp med skarpe piksler.
    const c = document.getElementById('c');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const scale = Math.ceil(size / grid);
    const off = Math.floor((size - grid * scale) / 2);
    ctx.drawImage(small, off, off, grid * scale, grid * scale);
    document.title = 'ready';
  </script>
</body>
</html>
